# Rebuild cv.pdf and resume.pdf whenever their .tex sources change, and commit the PDFs back.
# Only .tex changes trigger it and it only commits PDFs, so it can't trigger itself.
name: Build CV
on:
  push:
    branches: [main]
    paths: ['cv.tex', 'resume.tex']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            resume.tex
      - name: Commit PDFs
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add cv.pdf resume.pdf
          git commit -m "Rebuild CV and resume PDFs" || exit 0
          git push
